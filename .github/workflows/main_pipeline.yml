name: CI/CD Pipeline - Orquestación Blue-Green

on:
  push:
    branches: [ master ]

jobs:
  analisis_calidad:
    name: Análisis de Calidad (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo con SonarQube
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=pipeline-node-proyecto

  prueba_rendimiento:
    name: Prueba de Rendimiento (K6)
    runs-on: ubuntu-latest
    needs: analisis_calidad
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Ejecutar K6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/script_k6.js

  construccion_imagen:
    name: Construcción de Imagen (Docker)
    runs-on: ubuntu-latest
    needs: prueba_rendimiento
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pipeline-node:master

  despliegue_produccion:
    name: Orquestación Blue-Green (SSH)
    runs-on: ubuntu-latest
    needs: construccion_imagen
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Ejecutar Despliegue Inteligente
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/pipeline-node || exit

            # 1. Leer el estado actual (Memoria)
            if [ ! -f current_deploy.env ]; then
              echo "CURRENT_COLOR=blue" > current_deploy.env
            fi
            source current_deploy.env

            # 2. Logica de Inversion: Determinar el objetivo
            if [ "$CURRENT_COLOR" == "blue" ]; then
              TARGET_COLOR="green"
              TARGET_PORT="3001"
            else
              TARGET_COLOR="blue"
              TARGET_PORT="3000"
            fi

            echo "Desplegando hacia el entorno: $TARGET_COLOR en el puerto $TARGET_PORT"

            # 3. Actualizar contenedores
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Forzar la descarga de la imagen que acabamos de subir a GHCR
            docker-compose pull

            # Levantar con --force-recreate para que Docker ignore la caché local de la VM
            docker-compose up -d --force-recreate

            # 4. Sustitucion Automática de Nginx (envsubst)
            export APP_TARGET_IP="127.0.0.1"
            export APP_TARGET_PORT=$TARGET_PORT
            export DEPLOYMENT_COLOR=$TARGET_COLOR

            envsubst '${APP_TARGET_IP} ${APP_TARGET_PORT} ${DEPLOYMENT_COLOR}' < nginx.conf.template | sudo tee /etc/nginx/conf.d/default.conf > /dev/null

            # 5. Validar y Recargar Nginx
            if sudo nginx -t; then
              sudo systemctl reload nginx
              # 6. Persistencia: Actualizar la memoria para el siguiente despliegue
              echo "CURRENT_COLOR=$TARGET_COLOR" > current_deploy.env
              echo "Despliegue $TARGET_COLOR completado con éxito."
            else
              echo "Error en la configuración de Nginx. Abortando cambio de tráfico."
              exit 1
            fi
 