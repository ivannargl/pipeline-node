name: CI/CD Pipeline - Calidad, Rendimiento y Despliegue V1

on:
  push:
    branches: [ master ]

jobs:
  analisis_calidad:
    name: Análisis de Calidad (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo con SonarQube
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=pipeline-node-proyecto

  prueba_rendimiento:
    name: Prueba de Rendimiento (K6)
    runs-on: ubuntu-latest
    needs: analisis_calidad
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Ejecutar K6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/script_k6.js 

  construccion_imagen:
    name: Construcción de Imagen (Docker)
    runs-on: ubuntu-latest
    needs: prueba_rendimiento
    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pipeline-node:master

  despliegue_produccion:
    name: Despliegue a Producción (SSH)
    runs-on: ubuntu-latest
    needs: construccion_imagen
    steps:
      - name: Desplegar en VM vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Entrar a la carpeta del proyecto
            cd /home/${{ secrets.SERVER_USER }}/pipeline-node || exit

            # 2. Login en el registro
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Descargar versiones nuevas 
            docker-compose pull

            # 4. Levantar la infraestructura (App + Prometheus + Grafana + Node Exporter)
            docker-compose up -d --build 